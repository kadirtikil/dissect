name: tests

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest

    # The package supports a range rather than a pinned version, so the range is
    # what gets tested. `lowest` is the leg that matters most: it pins the floor
    # in composer.json to something a machine checks, rather than something that
    # was true on the day it was written.
    #
    # The floor is Laravel 13, which needs PHP 8.3 — so 8.2 is not a leg, it is
    # a version the package cannot install on.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        deps: [highest]
        include:
          - php: '8.3'
            deps: lowest

    name: PHP ${{ matrix.php }} · ${{ matrix.deps }} deps

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # SQLite is the workbench database; the suite never touches a server.
          extensions: sqlite3, pdo_sqlite, mbstring
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.deps }}-

      # `update`, not `install`: composer.lock pins one resolution, and testing
      # only that would defeat the point of the matrix above.
      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress \
            ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run tests
        run: vendor/bin/phpunit

  # The frontend half. dist/ is what users install, and dist.yml only checks it
  # was rebuilt, not that what it was built from type-checks, lints or passes
  # its own tests. The browser tests are the e2e job below.
  frontend:
    runs-on: ubuntu-latest
    name: frontend · types, lint, unit tests

    steps:
      - uses: actions/checkout@v4

      # No `packageManager` field in package.json to read the version from, so
      # it is pinned here. pnpm-workspace.yaml's `allowBuilds` needs 11+.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      # The same linters as `pnpm lint`, without its --fix: CI reports, it does
      # not rewrite. ESLint runs from inside each tree, as the scripts do.
      - name: Lint
        run: |
          pnpm exec oxlint resources/js e2e
          (cd resources/js && pnpm exec eslint .)
          (cd e2e && pnpm exec eslint .)

      - name: Formatting
        run: pnpm exec prettier --check resources/js/

      - name: Unit tests
        run: pnpm exec vitest run

  # The Playwright suite, against the Vite dev server: the fixtures it reads are
  # in public/, and the layout and views endpoints exist only under `vite dev`.
  # Chromium only. Firefox and WebKit stay a local run (`pnpm test:e2e`); three
  # browsers would triple the time for what is mostly the same page logic.
  e2e:
    runs-on: ubuntu-latest
    name: frontend · browser tests

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm exec playwright test --project=chromium

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
